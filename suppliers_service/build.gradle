plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.0-SNAPSHOT'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.gapsi'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.12'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation 'org.mapstruct:mapstruct:1.6.2'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}


tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
    exclude '**/ec/com/softka/client_service/ClientServiceApplication/**/*IntegrationTest*'
}

jacocoTestReport {
    dependsOn test
    reports {
        html.required = true
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('jacocoHtml')
    }
    afterEvaluate {
        getClassDirectories().setFrom(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/com/gapsi/suppliers_service/SuppliersServiceApplication*',
                    '**/com/gapsi/suppliers_service/dto/**',
                    '**/com/gapsi/suppliers_service/mapper/**',
                    '**/com/gapsi/suppliers_service/model/**',
                    '**/com/gapsi/suppliers_service/repository/**',
                    '**/com/gapsi/suppliers_service/config/**',
                    '**/com/gapsi/suppliers_service/exception/**',
            ])
        })
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            element = 'CLASS'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.85
            }
            excludes = [
                    'com.gapsi.suppliers_service.SuppliersServiceApplication',
                    'com.gapsi.suppliers_service.dto.**',
                    'com.gapsi.suppliers_service.mapper.**',
                    'com.gapsi.suppliers_service.model.**',
                    'com.gapsi.suppliers_service.repository.**',
                    'com.gapsi.suppliers_service.config.**',
                    'com.gapsi.suppliers_service.exception.**',
            ]
        }
    }
}

check.dependsOn jacocoTestCoverageVerification