<div class="supplier-form-container">
  <h2>{{ isEditMode ? 'Editar Proveedor' : 'Crear Nuevo Proveedor' }}</h2>

  <div *ngIf="isLoading" class="loading-container">
    <p>Cargando datos del proveedor...</p>
  </div>

  <form [formGroup]="supplierForm" (ngSubmit)="onSubmit()" class="supplier-form" *ngIf="!isLoading">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" required/>
      <mat-error *ngIf="supplierForm.get('name')?.hasError('required')">
        El nombre es obligatorio
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Razón Social</mat-label>
      <input matInput formControlName="business_name" required/>
      <mat-error *ngIf="supplierForm.get('business_name')?.hasError('required')">
        La razón social es obligatoria
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Dirección</mat-label>
      <input matInput formControlName="address" required/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Correo Electrónico</mat-label>
      <input matInput formControlName="email"/>
      <mat-error *ngIf="supplierForm.get('email')?.hasError('email')">
        Formato de correo no válido
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Teléfono</mat-label>
      <input matInput formControlName="phone"/>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Estado</mat-label>
      <mat-select formControlName="status">
        <mat-option *ngFor="let s of statuses" [value]="s">{{ s }}</mat-option>
      </mat-select>
    </mat-form-field>

    <div class="form-actions">
      <button mat-raised-button color="primary" type="submit">
        {{ isEditMode ? 'Actualizar Proveedor' : 'Guardar Proveedor' }}
      </button>
      <button mat-button type="button" (click)="onCancel()">
        Cancelar
      </button>
    </div>
  </form>
</div>
