<div class="supplier-list-container">
  <div class="header-section">
    <button mat-raised-button color="primary" (click)="navigateToForm()">
      <mat-icon>add</mat-icon>
      Nuevo Proveedor
    </button>
  </div>

  <div class="table-container">
    <table mat-table [dataSource]="pageResponse.content" class="suppliers-table">

      <!-- Columna Nombre -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.name }}</td>
      </ng-container>

      <!-- Columna Razón Social -->
      <ng-container matColumnDef="business_name">
        <th mat-header-cell *matHeaderCellDef>Razón Social</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.business_name }}</td>
      </ng-container>

      <!-- Columna Dirección -->
      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Dirección</th>
        <td mat-cell *matCellDef="let supplier">{{ supplier.address }}</td>
      </ng-container>

      <!-- Columna Email -->
      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let supplier">
          <span *ngIf="supplier.email; else noEmail">{{ supplier.email }}</span>
          <ng-template #noEmail>
            <span class="no-data">-</span>
          </ng-template>
        </td>
      </ng-container>

      <!-- Columna Teléfono -->
      <ng-container matColumnDef="phone">
        <th mat-header-cell *matHeaderCellDef>Teléfono</th>
        <td mat-cell *matCellDef="let supplier">
          <span *ngIf="supplier.phone; else noPhone">{{ supplier.phone }}</span>
          <ng-template #noPhone>
            <span class="no-data">-</span>
          </ng-template>
        </td>
      </ng-container>

      <!-- Columna Estado -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let supplier">
          <mat-chip [class]="supplier.status === 'ACTIVE' ? 'status-active' : 'status-inactive'">
            {{ supplier.status === 'ACTIVE' ? 'ACTIVO' : 'INACTIVO' }}
          </mat-chip>
        </td>
      </ng-container>

      <!-- Columna Acciones -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let supplier">
          <button mat-icon-button [matMenuTriggerFor]="menu" [matMenuTriggerData]="{supplier: supplier}">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item (click)="editSupplier(supplier)">
              <mat-icon>edit</mat-icon>
              Editar
            </button>
            <button mat-menu-item (click)="toggleStatus(supplier)">
              <mat-icon>{{ supplier.status === 'ACTIVE' ? 'pause' : 'play_arrow' }}</mat-icon>
              {{ supplier.status === 'ACTIVE' ? 'Desactivar' : 'Activar' }}
            </button>
            <button mat-menu-item (click)="deleteSupplier(supplier)" class="delete-action">
              <mat-icon>delete</mat-icon>
              Eliminar
            </button>
          </mat-menu>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <!-- Mensaje cuando no hay datos -->
    <div *ngIf="pageResponse.empty" class="no-data-message">
      <mat-icon>inbox</mat-icon>
      <p>No hay proveedores registrados</p>
      <button mat-raised-button color="primary" (click)="navigateToForm()">
        Crear Primer Proveedor
      </button>
    </div>
  </div>

  <!-- Paginador -->
  <mat-paginator
    [length]="pageResponse.total_elements"
    [pageSize]="pageResponse.size"
    [pageSizeOptions]="[5, 10, 20, 50]"
    [pageIndex]="pageResponse.number"
    (page)="onPageChange($event)"
    showFirstLastButtons>
  </mat-paginator>
</div>
